# kind cluster for the e2e tests: 1 control plane and 2 workers, so that pods
# spread across nodes. The node image is pinned in run.sh.
# No port mappings yet: the Ingress scenarios (4.6) add them.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
