# k3d cluster for the e2e tests: 1 server and 2 agents, so that pods spread
# across nodes. The k3s image is pinned in cluster.sh. k3s keeps its built-in
# Traefik, which serves the Ingress and the Gateway on port 80 of the load
# balancer, mapped to localhost:18082.
apiVersion: k3d.io/v1alpha5
kind: Simple
servers: 1
agents: 2
ports:
  - port: 127.0.0.1:18082:80
    nodeFilters:
      - loadbalancer
options:
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
