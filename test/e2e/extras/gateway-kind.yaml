# The Gateway for the e2e tests on kind, served by NGINX Gateway Fabric. Its
# listener takes HTTPRoutes from every namespace. NGINX Gateway Fabric exposes
# it on NodePort 30081, which kind maps to localhost:18081.
apiVersion: v1
kind: Namespace
metadata:
  name: hk-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hk-gateway
  namespace: hk-gateway
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
