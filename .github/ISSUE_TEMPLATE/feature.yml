name: Feature
description: Suggest a change or an addition.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The change you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you thought about
