# Runs the image, proxy and e2e tests on every PR, as required checks.
#
# - workflow-tests: test/ci/find-pr-issue-test.sh, the tests for the resolver
#   that the PR workflows share.
# - image-tests: test/image/run.sh (I1 to I7, I5a) and test/proxy/run.sh
#   (P1 to P3), on native amd64 and arm64 runners. Each job builds the image
#   for its own architecture, so arm64 is built and run on real arm64.
# - e2e: test/e2e/run.sh on kind and on k3d, on amd64. The chart pins pods to
#   amd64 until 4.1, which adds the arm64 e2e job.
#
# Tool versions come from test/ci/install-tools.sh, the only place they are set.
# A failed e2e scenario prints its diagnostics in the job log.
name: Tests

on:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: [main, "release-*"]
  workflow_dispatch:
  # The publish workflow runs the full suite before it publishes.
  workflow_call:

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs. Runs on branches are never
# cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-tests:
    name: workflow-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolver tests
        run: test/ci/find-pr-issue-test.sh

  image-tests:
    name: image-tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        run: test/ci/install-tools.sh trivy

      - name: Build the image for ${{ matrix.arch }}
        run: docker build --tag hello-kubernetes:ci src/app

      - name: Image tests
        run: test/image/run.sh hello-kubernetes:ci

      - name: Proxy tests
        run: test/proxy/run.sh hello-kubernetes:ci

  # Each architecture runs the default chart on its own native runner, so the
  # arm64 jobs prove that the chart schedules and runs on arm64 nodes.
  e2e:
    name: e2e (${{ matrix.cluster }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cluster: [kind, k3d]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        run: test/ci/install-tools.sh ${{ matrix.cluster == 'kind' && 'kind cloud-provider-kind' || 'k3d' }} helm kubectl

      - name: Chart tests
        run: test/chart/run.sh

      - name: Build the image for ${{ matrix.arch }}
        run: make e2e-image

      - name: E2E tests on ${{ matrix.cluster }}, ${{ matrix.arch }}
        run: IMAGE=hello-kubernetes:e2e test/e2e/run.sh ${{ matrix.cluster }}

  # E13: the default chart, an Ingress and restricted Pod Security on the
  # oldest Kubernetes version the chart supports.
  e2e-oldest:
    name: e2e (kind, amd64, Kubernetes 1.35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the tools
        run: test/ci/install-tools.sh kind cloud-provider-kind helm kubectl

      - name: Build the image
        run: make e2e-image

      - name: E2E tests on Kubernetes 1.35
        run: E2E_KUBERNETES=oldest IMAGE=hello-kubernetes:e2e test/e2e/run.sh kind e01 e06 e07
