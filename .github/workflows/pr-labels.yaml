# Labels PRs: area: labels from the changed paths (.github/labeler.yml), and
# the type label and milestone of the PR's issue, found by
# .github/scripts/find-pr-issue.sh, the same resolver as pr-issue-check.yaml.
#
# Runs on pull_request_target so that it can label PRs from forks. It must
# never check out or run the PR's code.
name: PR labels

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      # In pull_request_target, checkout gets the base branch: trusted code only.
      # Never check out the PR's head here.
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply area labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

      - name: Copy the type label and milestone from the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_MILESTONE: ${{ github.event.pull_request.milestone.title }}
        run: |
          set -euo pipefail

          set +e
          issue=$(.github/scripts/find-pr-issue.sh "$PR" "$HEAD_REF")
          status=$?
          set -e
          if ((status != 0)); then
            echo "No single open issue for this PR (status $status). Nothing to copy."
            exit 0
          fi

          type_labels='["bug","enhancement","documentation","security","dependencies","breaking-change"]'
          labels=$(gh api "repos/$GH_REPO/issues/$issue" --jq "[.labels[].name | select(. as \$l | $type_labels | index(\$l))] | join(\",\")")
          milestone=$(gh api "repos/$GH_REPO/issues/$issue" --jq '.milestone.title // empty')

          args=()
          [[ -n "$labels" ]] && args+=(--add-label "$labels")
          [[ -z "$PR_MILESTONE" && -n "$milestone" ]] && args+=(--milestone "$milestone")
          if ((${#args[@]} > 0)); then
            gh pr edit "$PR" "${args[@]}"
            echo "Copied from #$issue: labels '$labels', milestone '${milestone:-none}'."
          else
            echo "Nothing to copy from #$issue."
          fi
