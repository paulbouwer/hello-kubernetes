# Fails a PR that has no open issue. The issue comes from the head branch
# name ({type}/{issue}-...), or from an issue linked in the PR's Development
# section. Linking an issue doesn't start a run, so run the job again after.
#
# Runs on pull_request with read-only access, from the PR's own branch, so
# it also works for the first release PR into main.
name: PR issue check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, "release-*"]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  issue-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the PR has an open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          if [[ "$AUTHOR" == "dependabot[bot]" ]]; then
            echo "Dependabot PR: no issue needed."
            exit 0
          fi
          if [[ "$HEAD_REF" == release-* && "$BASE_REF" == "main" ]]; then
            echo "Release PR into main: no issue needed."
            exit 0
          fi

          candidates=()
          if [[ "$HEAD_REF" =~ ^[a-z]+/([0-9]+)- ]]; then
            candidates+=("${BASH_REMATCH[1]}")
          fi
          owner="${GH_REPO%/*}"
          name="${GH_REPO#*/}"
          while read -r n; do
            [[ -n "$n" ]] && candidates+=("$n")
          done < <(gh api graphql \
            -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){closingIssuesReferences(first:10){nodes{number repository{nameWithOwner}}}}}}' \
            -f o="$owner" -f r="$name" -F n="$PR" \
            --jq ".data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.repository.nameWithOwner == \"$GH_REPO\") | .number")

          for n in $(printf "%s\n" "${candidates[@]}" | awk '!seen[$0]++'); do
            state=$(gh api "repos/$GH_REPO/issues/$n" --jq 'select(.pull_request == null) | .state' 2>/dev/null || true)
            if [[ "$state" == "open" ]]; then
              echo "PR is for open issue #$n."
              exit 0
            fi
            echo "#$n is not an open issue in $GH_REPO."
          done

          echo "::error::This PR has no open issue. Name the branch {type}/{issue}-{slug} for an open issue, or ask the maintainer to link the PR to an issue in the Development section, then run this check again. See CONTRIBUTING.md."
          exit 1
