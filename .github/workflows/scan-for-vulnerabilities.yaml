# Scans the image built from the code for vulnerabilities with Trivy.
#
# - Fails on HIGH and CRITICAL findings that have a fix (the same rule as
#   image test I4), so a PR with a fixable vulnerability can't merge.
# - Reports every finding, of every severity, to code scanning.
# - Runs every day, because new CVEs appear without code changes. GitHub runs
#   scheduled workflows only from the default branch.
# - Every day, also scans the published image that users pull
#   (paulbouwer/hello-kubernetes:1). When it fails, a patch release is due.
#
# Trivy is installed by test/ci/install-tools.sh, at the version pinned there,
# and checked against a SHA-256 kept there, not only against the checksums file
# from the same release. The image tests use the same table.
#
# Keep the file name and the job name: code scanning groups results by them,
# so the new results replace the alerts from the old scan.
name: Scan for vulnerabilities

on:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: [main, "release-*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: hello-kubernetes:scan

jobs:
  scan-and-report-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build --tag "$IMAGE" \
            --build-arg IMAGE_VERSION="$(jq -r .version src/app/package.json)" \
            --build-arg IMAGE_CREATE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_SOURCE_REVISION="$GITHUB_SHA" \
            --file src/app/Dockerfile src/app

      - name: Install Trivy
        run: |
          test/ci/install-tools.sh trivy
          trivy --version

      - name: Report every finding
        run: |
          trivy image --image-src docker --scanners vuln --format sarif --output trivy-results.sarif "$IMAGE"

      - name: Upload the report to code scanning
        # PRs from forks get a read-only token, so they can't upload.
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on fixable HIGH and CRITICAL findings
        run: |
          trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --format table "$IMAGE"

  scan-published-image:
    # Only on the schedule or by hand. Its own job name gives it its own
    # category in code scanning.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      PUBLISHED_IMAGE: docker.io/paulbouwer/hello-kubernetes:1
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          test/ci/install-tools.sh trivy
          trivy --version

      - name: Report every finding
        run: |
          trivy image --image-src remote --scanners vuln --format sarif \
            --output trivy-published.sarif "$PUBLISHED_IMAGE"

      - name: Upload the report to code scanning
        if: always() && hashFiles('trivy-published.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-published.sarif

      - name: Fail on fixable HIGH and CRITICAL findings
        run: |
          trivy image --image-src remote --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --format table "$PUBLISHED_IMAGE"
