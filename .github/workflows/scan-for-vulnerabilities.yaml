# Scans the image built from the code for vulnerabilities with Trivy.
#
# - Fails on HIGH and CRITICAL findings that have a fix (the same rule as
#   image test I4), so a PR with a fixable vulnerability can't merge.
# - Reports every finding, of every severity, to code scanning.
# - Runs every day, because new CVEs appear without code changes. GitHub runs
#   scheduled workflows only from the default branch.
#
# Trivy is installed from a pinned release and checked against a SHA-256 kept
# here, not only against the checksums file from the same release. Dependabot
# can't update these two values: check for a newer Trivy at each release, and
# use a version published at least 7 days ago (AGENTS.md rule 8).
#
# Keep the file name and the job name: code scanning groups results by them,
# so the new results replace the alerts from the old scan.
name: Scan for vulnerabilities

on:
  pull_request:
    branches: [main, "release-*"]
  push:
    branches: [main, "release-*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
  IMAGE: hello-kubernetes:scan

jobs:
  scan-and-report-vulnerabilities:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build --tag "$IMAGE" \
            --build-arg IMAGE_VERSION="$(jq -r .version src/app/package.json)" \
            --build-arg IMAGE_CREATE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg IMAGE_SOURCE_REVISION="$GITHUB_SHA" \
            --file src/app/Dockerfile src/app

      - name: Install Trivy
        run: |
          file="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$(mktemp -d)"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${file}"
          echo "${TRIVY_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "$file" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Report every finding
        run: |
          trivy image --image-src docker --scanners vuln --format sarif --output trivy-results.sarif "$IMAGE"

      - name: Upload the report to code scanning
        # PRs from forks get a read-only token, so they can't upload.
        if: always() && hashFiles('trivy-results.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on fixable HIGH and CRITICAL findings
        run: |
          trivy image --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --format table "$IMAGE"
