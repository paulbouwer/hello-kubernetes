apiVersion: v2
name: hello-kubernetes
description: A demo application for a Kubernetes cluster. It shows a message, the pod and node it runs on, and the image architecture.
type: application
# The chart, the app and the image share one version. The publish workflow
# checks that the release tag, version, appVersion, src/app/package.json and
# the artifacthub.io/images entry all match.
version: 1.11.0
appVersion: "1.11.0"
home: https://github.com/paulbouwer/hello-kubernetes
sources:
  - https://github.com/paulbouwer/hello-kubernetes
keywords:
  - demo
  - hello-world
  - ingress
  - gateway-api
maintainers:
  - name: Paul Bouwer
    url: https://github.com/paulbouwer
annotations:
  artifacthub.io/license: MIT
  artifacthub.io/images: |
    - name: hello-kubernetes
      image: paulbouwer/hello-kubernetes:1.11.0
      platforms:
        - linux/amd64
        - linux/arm64
  artifacthub.io/links: |
    - name: Deploy using Helm
      url: https://github.com/paulbouwer/hello-kubernetes/blob/main/docs/deploy-using-helm.md
