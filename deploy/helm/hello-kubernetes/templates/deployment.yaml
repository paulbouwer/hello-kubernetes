{{- $prefix := include "hello-kubernetes.pathPrefix" . -}}
{{- $rewrite := eq (include "hello-kubernetes.rewritePath" .) "true" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hello-kubernetes.name" . }}
  labels:
    {{- include "hello-kubernetes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      {{- include "hello-kubernetes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hello-kubernetes.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "hello-kubernetes.name" . }}
      {{- with .Values.deployment.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "hello-kubernetes.image" . | quote }}
          imagePullPolicy: {{ .Values.deployment.container.image.pullPolicy }}
          {{- with .Values.deployment.container.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.deployment.container.port }}
              protocol: TCP
          # Keep serving for a few seconds after the pod is told to stop, while
          # the Service and the Ingress or Gateway stop sending it requests.
          # The app exits as soon as it gets SIGTERM, so without this a rolling
          # update drops a request now and then (e2e E12).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            httpGet:
              path: {{ ternary "/" (printf "%s/" $prefix) (or $rewrite (not $prefix)) | quote }}
              port: http
          readinessProbe:
            httpGet:
              path: {{ ternary "/" (printf "%s/" $prefix) (or $rewrite (not $prefix)) | quote }}
              port: http
          env:
          {{- if ne (.Values.deployment.container.port | int) (8080 | int) }}
          - name: PORT
            value: {{ .Values.deployment.container.port | quote }}
          {{- end }}
          {{- if .Values.message }}
          - name: MESSAGE
            value: {{ .Values.message | quote }}
          {{- end }}
          {{- if $prefix }}
          - name: HANDLER_PATH_PREFIX
            value: {{ ternary "" $prefix $rewrite | quote }}
          - name: RENDER_PATH_PREFIX
            value: {{ $prefix | quote }}
          {{- end }}
          - name: KUBERNETES_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: KUBERNETES_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: KUBERNETES_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: CONTAINER_IMAGE
            value: {{ include "hello-kubernetes.image" . | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
